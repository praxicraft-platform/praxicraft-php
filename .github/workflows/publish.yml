name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "composer.json"
      - ".github/workflows/publish.yml"

concurrency:
  group: publish-php
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.head_commit != null &&
        !startsWith(github.event.head_commit.message, 'chore(release):') &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json, hash
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: composer test

  publish:
    needs: test
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.head_commit != null &&
        !startsWith(github.event.head_commit.message, 'chore(release):') &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    runs-on: ubuntu-latest
    environment: packagist
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Auto-bump patch version and CHANGELOG
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0')"
          RAW="${LATEST#v}"
          IFS=. read -r MAJOR MINOR PATCH <<<"$RAW"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"
          NOTES="$(git log "${LATEST}..HEAD" --pretty=format:'- %s' --no-merges 2>/dev/null | sed '/^chore(release):/d' || true)"
          if [ -z "$NOTES" ]; then NOTES="- Maintenance release."; fi
          export VERSION NOTES
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          v, notes = os.environ["VERSION"], os.environ["NOTES"]
          ver = Path("src/Version.php")
          ver.write_text(re.sub(r"STRING = '[^']*'", f"STRING = '{v}'", ver.read_text()))
          cl = Path("CHANGELOG.md")
          body = cl.read_text() if cl.exists() else "# Changelog\n\n"
          prior = body[body.index("## "):] if "## " in body else ""
          cl.write_text(f"# Changelog\n\n## {v}\n\n{notes}\n\n{prior}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Version.php CHANGELOG.md
          if ! git diff --cached --quiet; then
            # Local commit only — do not push to main (rules require PRs).
            # Pushing the annotated tag keeps this release commit reachable.
            git commit -m "chore(release): ${TAG}"
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
      - name: Create and push release tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then echo "Tag exists"; exit 0; fi
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Notify Packagist
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGIST_TOKEN:-}" ] || [ -z "${PACKAGIST_USERNAME:-}" ]; then
            echo "Packagist secrets not set — tag/GitHub Release only (Packagist can still sync via GitHub)."
            exit 0
          fi
          curl -sS -X POST "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"repository":{"url":"https://github.com/praxicraft-platform/praxicraft-php"}}'
      - name: Package source archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git archive --format=zip --prefix="praxicraft-php-${VERSION}/" -o "praxicraft-php-${VERSION}.zip" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            Packagist / Composer: `composer require praxicraft/assess:${{ steps.version.outputs.tag }}`
          generate_release_notes: true
          files: |
            praxicraft-php-*.zip
