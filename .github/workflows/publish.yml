name: Publish

# Release via tags only. Bump version in Version.php on main, tag, then push tag or workflow_dispatch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v1.0.0). Required for manual runs."
        required: true
        type: string

concurrency:
  group: publish-php
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, json, hash
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - run: composer test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: packagist
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "Tag must look like v1.0.0 (got: $TAG)"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} (package version ${VERSION})"

      - name: Verify package version matches tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          PHP_VER=$(grep "STRING" src/Version.php | sed -E "s/.*'([^']+)'.*/\1/")
          if [ "$PHP_VER" != "$VERSION" ]; then
            echo "Version mismatch: tag v${VERSION}, Version.php=${PHP_VER}"
            exit 1
          fi

      - name: Notify Packagist
        env:
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "${PACKAGIST_TOKEN:-}" ] || [ -z "${PACKAGIST_USERNAME:-}" ]; then
            echo "Packagist secrets not set — tag/GitHub Release only (Packagist can still sync via GitHub)."
            exit 0
          fi
          curl -sS -X POST "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"repository":{"url":"https://github.com/praxicraft-platform/praxicraft-php"}}'
      - name: Package source archive
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          git archive --format=zip --prefix="praxicraft-php-${VERSION}/" -o "praxicraft-php-${VERSION}.zip" HEAD
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.tag }}
          body: |
            Packagist / Composer: `composer require praxicraft/assess:${{ steps.release.outputs.tag }}`
          generate_release_notes: true
          files: |
            praxicraft-php-*.zip
